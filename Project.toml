# Julia workspace for the cluster (slurm instantiate installs the root project): one shared
# Manifest.toml for the listed environments, which are still used via --project=env_xxx.
[workspace]
projects = ["env_headless", "env_cuda"]

# Pins the CUDA runtime, so instantiate downloads it on the login node (no GPU there).
# Needs an NVIDIA driver that supports CUDA 12 (>= 525).
[preferences.CUDA_Runtime_jll]
version = "12.6"
